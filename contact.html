<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Field Notes</title>
  <meta name="description" content="Field Notes: a beginner's blog about learning web development.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Field Notes</a>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container contact">
    <div>
      <h1 class="page-title">Get in touch</h1>
      <p class="lead">Questions, feedback or a topic you want covered? Send a note and I will reply within a few days.</p>
      <ul class="details">
        <li><i class="fa-solid fa-envelope"></i> you@example.com</li>
        <li><i class="fa-solid fa-location-dot"></i> Your City, Pakistan</li>
        <li><i class="fa-brands fa-github"></i> github.com/yourname</li>
      </ul>
    </div>

    <form class="form" action="#" method="post">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button class="btn" type="submit">Send message</button>
    </form>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 Field Notes. Built by Laiba Irshad.</p>
      <ul class="social">
        <li><a href="https://github.com/" aria-label="GitHub"><i class="fa-brands fa-github"></i></a></li>
        <li><a href="https://www.linkedin.com/" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a></li>
        <li><a href="mailto:you@example.com" aria-label="Email"><i class="fa-solid fa-envelope"></i></a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
